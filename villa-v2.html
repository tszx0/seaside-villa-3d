<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>海景别墅 · 单层版本（v2）</title>
<style>
  :root{
    --ink:#0d1418; --paper:#f7f4ee; --line:rgba(255,255,255,.16);
    --glass:rgba(14,20,26,.72); --accent:#c8a06a; --sea:#1d6f7a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1418;color:var(--paper);
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif}
  canvas{display:block;position:fixed;inset:0}
  .panel{
    position:fixed;background:var(--glass);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:16px;z-index:10;
    box-shadow:0 18px 50px rgba(0,0,0,.45)
  }
  #left{left:20px;top:20px;width:286px;padding:18px 18px 14px}
  #left h1{margin:0 0 2px;font-size:17px;letter-spacing:.12em;font-weight:600}
  #left .sub{font-size:11px;color:#9fb1b8;letter-spacing:.18em;text-transform:uppercase}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 12px}
  .stat{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:8px 10px}
  .stat b{display:block;font-size:16px;color:#fff;font-variant-numeric:tabular-nums}
  .stat span{font-size:10px;color:#93a6ad;letter-spacing:.06em}
  .sechead{font-size:10px;letter-spacing:.2em;color:#8fa2a9;margin:12px 0 6px}
  .rooms{display:flex;flex-direction:column;gap:4px;max-height:270px;overflow:auto;padding-right:2px}
  .room{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:8px 10px;border-radius:9px;border:1px solid transparent;cursor:pointer;
    font-size:12.5px;color:#dbe6e9;background:rgba(255,255,255,.03);transition:.16s
  }
  .room:hover{background:rgba(200,160,106,.14);border-color:rgba(200,160,106,.35)}
  .room.on{background:rgba(200,160,106,.2);border-color:var(--accent);color:#fff}
  .room i{font-style:normal;font-size:10px;color:#8fa2a9}
  .toggles{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  button.t{
    flex:1;min-width:78px;background:rgba(255,255,255,.06);color:#cfe0e4;border:1px solid var(--line);
    border-radius:9px;padding:7px 6px;font-size:11px;cursor:pointer;transition:.16s;letter-spacing:.04em
  }
  button.t:hover{background:rgba(255,255,255,.12)}
  button.t.on{background:rgba(200,160,106,.22);border-color:var(--accent);color:#fff}
  #right{right:20px;top:20px;width:280px;padding:16px 16px 14px;display:none}
  #right.show{display:block}
  #right h2{margin:0 0 2px;font-size:15px;letter-spacing:.06em}
  #right .meta{font-size:11px;color:#9fb1b8;margin-bottom:10px}
  .kv{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px dashed rgba(255,255,255,.1)}
  .kv span:last-child{color:#fff;font-variant-numeric:tabular-nums}
  #tip{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:10;
    font-size:11.5px;color:#a9bcc2;background:rgba(10,16,20,.7);border:1px solid var(--line);
    padding:8px 16px;border-radius:99px;letter-spacing:.06em;backdrop-filter:blur(10px)
  }
  #loading{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#0b1418;
    transition:opacity .6s;font-size:12px;letter-spacing:.24em;color:#8fa2a9}
  #loading.hide{opacity:0;pointer-events:none}
  .dot{width:6px;height:6px;background:var(--accent);border-radius:50%;display:inline-block;margin-left:8px;
    animation:p 1s infinite alternate}
  @keyframes p{from{opacity:.2}to{opacity:1}}
  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:3px}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="left" class="panel">
  <h1>海 景 别 墅</h1>
  <div class="sub">Seaside Villa · 3,000 m²</div>
  <div class="stats">
    <div class="stat"><b>3,012</b><span>建筑面积 m²</span></div>
    <div class="stat"><b>6</b><span>海景卧室套房</span></div>
    <div class="stat"><b>25 m</b><span>无边际泳池</span></div>
    <div class="stat"><b>1:1</b><span>米制模型</span></div>
  </div>
  <div class="sechead">房 间 导 览</div>
  <div style="font-size:10px;color:#7f939a;margin:-2px 0 8px">※ 三维为方案示意，面积按设计任务书标注</div>
  <div class="rooms" id="rooms"></div>
  <div class="toggles">
    <button class="t on" id="btnRoof">隐藏屋顶</button>
    <button class="t" id="btnLabels">房间标签</button>
    <button class="t" id="btnPlan">俯瞰总览</button>
  </div>
</div>

<div id="right" class="panel">
  <h2 id="rName">—</h2>
  <div class="meta" id="rMeta">—</div>
  <div id="rKv"></div>
</div>

<div id="tip">左键拖拽旋转 · 滚轮缩放 · 右键平移 · 数字键 1–8 切换视角</div>
<div id="loading">正在构建三维场景<span class="dot"></span></div>

<script src="three.min.js"></script>
<script>
/* ============================================================
   海景别墅 3D 方案 · 单文件演示
   全部几何体由 Three.js 程序化生成，无外部模型/贴图依赖
   ============================================================ */
const T = THREE;
const canvas = document.getElementById('scene');
const renderer = new T.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.outputColorSpace = T.SRGBColorSpace;

const scene = new T.Scene();
scene.fog = new T.Fog(0xbdd6dc, 180, 620);

const camera = new T.PerspectiveCamera(46, innerWidth/innerHeight, 0.1, 3000);

/* ---------- 天空 ---------- */
const skyGeo = new T.SphereGeometry(1400, 32, 20);
const skyMat = new T.ShaderMaterial({
  side: T.BackSide,
  uniforms:{ top:{value:new T.Color(0x2f6fa8)}, mid:{value:new T.Color(0x8fc4d8)}, bot:{value:new T.Color(0xf3e7d3)} },
  vertexShader:`varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
  fragmentShader:`
    varying vec3 vP; uniform vec3 top, mid, bot;
    void main(){
      float h = normalize(vP).y;
      vec3 c = mix(bot, mid, smoothstep(-0.05, 0.28, h));
      c = mix(c, top, smoothstep(0.25, 0.85, h));
      gl_FragColor = vec4(c, 1.0);
    }`
});
scene.add(new T.Mesh(skyGeo, skyMat));

/* ---------- 光照 ---------- */
const sunDir = new T.Vector3(-0.45, 0.62, -0.64).normalize();
const sun = new T.DirectionalLight(0xfff1d8, 3.1);
sun.position.copy(sunDir).multiplyScalar(160);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 10; sun.shadow.camera.far = 400;
sun.shadow.camera.left = -120; sun.shadow.camera.right = 120;
sun.shadow.camera.top = 120; sun.shadow.camera.bottom = -120;
sun.shadow.bias = -0.0006;
scene.add(sun);
const hemi = new T.HemisphereLight(0xcfe6ff, 0x6b5b46, 0.85); scene.add(hemi);
const fill = new T.DirectionalLight(0xa8d8ff, 0.35); fill.position.set(60, 40, 90); scene.add(fill);

/* ---------- 海面 ---------- */
const seaUniforms = {
  uTime:{value:0},
  uSun:{value:sunDir.clone()},
  uDeep:{value:new T.Color(0x0d3f52)},
  uShallow:{value:new T.Color(0x2b8ea0)},
  uHorizon:{value:new T.Color(0xbdd6dc)}
};
const seaMat = new T.ShaderMaterial({
  uniforms: seaUniforms,
  vertexShader:`
    uniform float uTime; varying vec3 vW; varying vec3 vN; varying float vH;
    float h(vec2 p){
      return 0.42*sin(p.x*0.055 + uTime*0.9)
           + 0.28*sin(p.y*0.078 - uTime*1.15)
           + 0.16*sin((p.x+p.y)*0.16 + uTime*1.7)
           + 0.09*sin((p.x*0.6-p.y)*0.31 - uTime*2.2);
    }
    void main(){
      vec3 p = position;
      float H = h(p.xy);
      vec2 d = vec2(0.055*0.42*cos(p.x*0.055+uTime*0.9), 0.078*0.28*cos(p.y*0.078-uTime*1.15));
      vN = normalize(vec3(-d.x, 1.0, -d.y));
      vH = H;
      p.z += H;
      vW = (modelMatrix*vec4(p,1.0)).xyz;
      gl_Position = projectionMatrix*modelViewMatrix*vec4(p,1.0);
    }`,
  fragmentShader:`
    uniform vec3 uSun, uDeep, uShallow, uHorizon; varying vec3 vW; varying vec3 vN; varying float vH;
    void main(){
      vec3 V = normalize(cameraPosition - vW);
      vec3 N = normalize(vN);
      float fres = pow(1.0 - max(dot(N, V), 0.0), 3.0);
      vec3 col = mix(uDeep, uShallow, smoothstep(-0.5, 0.6, vH));
      vec3 R = reflect(-uSun, N);
      float spec = pow(max(dot(R, V), 0.0), 120.0) * 3.2;
      col += uHorizon * fres * 0.55;
      col += vec3(1.0,0.93,0.78) * spec;
      float dist = length(cameraPosition.xz - vW.xz);
      col = mix(col, uHorizon, smoothstep(320.0, 900.0, dist));
      gl_FragColor = vec4(col, 1.0);
    }`
});
const sea = new T.Mesh(new T.PlaneGeometry(2400, 2400, 160, 160), seaMat);
sea.rotation.x = -Math.PI/2;
sea.position.y = 0;
scene.add(sea);

/* ---------- 材质库 ---------- */
const M = {
  stone:   new T.MeshStandardMaterial({color:0xd6c8b2, roughness:.82, metalness:.05}),
  stoneDk: new T.MeshStandardMaterial({color:0xa89a86, roughness:.9}),
  rock:    new T.MeshStandardMaterial({color:0x6e6558, roughness:1}),
  grass:   new T.MeshStandardMaterial({color:0x4a6b3c, roughness:.95}),
  wood:    new T.MeshStandardMaterial({color:0x8a5a33, roughness:.55, metalness:.05}),
  woodLt:  new T.MeshStandardMaterial({color:0xc9a06d, roughness:.6}),
  floorWd: new T.MeshStandardMaterial({color:0xa87848, roughness:.62}),
  fabric:  new T.MeshStandardMaterial({color:0xece5da, roughness:.95}),
  linen:   new T.MeshStandardMaterial({color:0xfaf7f1, roughness:.92}),
  dark:    new T.MeshStandardMaterial({color:0x24201c, roughness:.7}),
  metal:   new T.MeshStandardMaterial({color:0x3d4147, roughness:.35, metalness:.85}),
  brass:   new T.MeshStandardMaterial({color:0xc8a06a, roughness:.3, metalness:.9}),
  glass:   new T.MeshPhysicalMaterial({color:0xdff1f6, roughness:.06, metalness:0, transparent:true,
             opacity:.16, side:T.DoubleSide, depthWrite:false}),
  water:   new T.MeshPhysicalMaterial({color:0x2fa3b8, roughness:.08, metalness:.1, transparent:true, opacity:.82}),
  marble:  new T.MeshStandardMaterial({color:0xf1ece4, roughness:.25, metalness:.06}),
};
const ACCENTS = [0x2f7f8a, 0xb5895f, 0xa8564b, 0x33475f, 0x6f7d54, 0x8a5f76];

/* ---------- 程序化贴图（Canvas 生成，无外部资源） ---------- */
function makeTex(w, h, draw, rx, ry){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new T.CanvasTexture(c);
  t.wrapS = t.wrapT = T.RepeatWrapping;
  t.repeat.set(rx || 1, ry || 1);
  t.colorSpace = T.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
const TEX = {
  wood: makeTex(512, 512, (g,w,h)=>{
    g.fillStyle = '#a97a4b'; g.fillRect(0,0,w,h);
    for(let i=0;i<160;i++){
      const y = Math.random()*h, a = 0.03 + Math.random()*0.07;
      g.strokeStyle = `rgba(60,34,16,${a})`; g.lineWidth = 0.6 + Math.random()*1.6;
      g.beginPath(); g.moveTo(0, y);
      for(let x=0;x<=w;x+=32) g.lineTo(x, y + Math.sin(x*0.02 + i)*3 + (Math.random()-0.5)*2);
      g.stroke();
    }
    // 板缝
    g.strokeStyle = 'rgba(40,24,12,.55)'; g.lineWidth = 2.5;
    for(let i=1;i<4;i++){ g.beginPath(); g.moveTo(0, i*h/4); g.lineTo(w, i*h/4); g.stroke(); }
    for(let i=0;i<4;i++){
      const off = (i%2)*w/2;
      g.beginPath(); g.moveTo(off, i*h/4); g.lineTo(off, (i+1)*h/4); g.stroke();
    }
  }, 2, 2),
  marble: makeTex(512, 512, (g,w,h)=>{
    g.fillStyle = '#f2ede4'; g.fillRect(0,0,w,h);
    for(let i=0;i<26;i++){
      g.strokeStyle = `rgba(150,140,125,${0.05+Math.random()*0.12})`;
      g.lineWidth = 0.6 + Math.random()*2.2;
      g.beginPath();
      let x = Math.random()*w, y = 0; g.moveTo(x,y);
      while(y < h){ x += (Math.random()-0.5)*40; y += 18 + Math.random()*26; g.lineTo(x,y); }
      g.stroke();
    }
    g.strokeStyle = 'rgba(120,110,96,.35)'; g.lineWidth = 3;
    g.strokeRect(0,0,w,h);
  }, 3, 3),
  rug: makeTex(256, 256, (g,w,h)=>{
    g.fillStyle = '#e8ddc9'; g.fillRect(0,0,w,h);
    g.strokeStyle = 'rgba(150,130,100,.5)'; g.lineWidth = 8; g.strokeRect(10,10,w-20,h-20);
    g.strokeStyle = 'rgba(150,130,100,.28)'; g.lineWidth = 2;
    for(let i=24;i<w-20;i+=14){
      g.beginPath(); g.moveTo(i, 26); g.lineTo(i, h-26); g.stroke();
    }
  }, 1, 1),
  fabric: makeTex(128, 128, (g,w,h)=>{
    g.fillStyle = '#f2ece2'; g.fillRect(0,0,w,h);
    for(let i=0;i<w;i+=2){
      g.fillStyle = i%4 ? 'rgba(0,0,0,.035)' : 'rgba(255,255,255,.05)';
      g.fillRect(i,0,1,h);
    }
  }, 6, 6),
};
M.floorWd.map = TEX.wood; M.floorWd.color.set(0xffffff); M.floorWd.roughness = .55; M.floorWd.needsUpdate = true;
M.marble.map  = TEX.marble; M.marble.color.set(0xffffff); M.marble.needsUpdate = true;
M.fabric.map  = TEX.fabric; M.fabric.color.set(0xf0e9dd); M.fabric.needsUpdate = true;
M.linen.map   = TEX.fabric; M.linen.needsUpdate = true;
const roomLights = [];

/* ---------- 通用几何 ---------- */
function box(w,h,d,mat,x,y,z,parent,cast=true){
  const m = new T.Mesh(new T.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); m.castShadow = cast; m.receiveShadow = true;
  (parent||scene).add(m); return m;
}
function cyl(rt,rb,h,mat,x,y,z,parent,seg=24){
  const m = new T.Mesh(new T.CylinderGeometry(rt,rb,h,seg), mat);
  m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true;
  (parent||scene).add(m); return m;
}
function plane(w,d,mat,x,y,z,parent){
  const m = new T.Mesh(new T.PlaneGeometry(w,d), mat);
  m.rotation.x = -Math.PI/2; m.position.set(x,y,z); m.receiveShadow = true;
  (parent||scene).add(m); return m;
}

/* ---------- 场地：礁岩 + 草坪 ---------- */
const FL = 3.4;                       // 首层地坪标高
const island = new T.Group(); scene.add(island);
box(116, 11, 78, M.rock, 0, FL-5.7, 6, island);
box(112, 0.5, 74, M.grass, 0, FL-0.30, 6, island);
// 海岸礁石
for(let i=0;i<26;i++){
  const a = (i/26)*Math.PI*2;
  const r = 60 + Math.random()*16;
  const s = 2 + Math.random()*5;
  const rock = new T.Mesh(new T.DodecahedronGeometry(s, 0), M.rock);
  rock.position.set(Math.cos(a)*r, FL-4.2 + Math.random()*2.2, Math.sin(a)*r*0.62 + 6);
  rock.rotation.set(Math.random(), Math.random(), Math.random());
  rock.castShadow = true; rock.receiveShadow = true;
  island.add(rock);
}

/* ---------- 别墅主体 ---------- */
const villa = new T.Group(); scene.add(villa);
const roofs = [];

const BED_W = 9, BED_D = 8, BED_N = 6, BED_Z = 6.0;
const wingW = BED_W*BED_N;

// 基座 + 楼板
box(64, 0.7, 34, M.stone, 0, FL-0.35, 2, villa);
// 卧室翼不另做厚板，房间自带木地板（避免遮住地面材质）
box(34, 0.3, 20, M.marble, -6, FL+0.15, -4, villa);

// 卧室翼：6 间套房，朝海一侧整面玻璃
const bedRooms = [];
for(let i=0;i<BED_N;i++){
  const cx = (i - (BED_N-1)/2) * BED_W;
  const g = new T.Group(); g.position.set(cx, FL, BED_Z); villa.add(g);
  const accent = new T.Color(ACCENTS[i%ACCENTS.length]);

  // 地板
  plane(BED_W, BED_D, M.floorWd, 0, 0.02, 0, g);
  // 后墙 + 两侧隔墙（高 3.6）
  box(BED_W, 3.7, 0.22, new T.MeshStandardMaterial({color:0xe9e2d5, roughness:.95}), 0, 1.85, -BED_D/2, g);
  box(0.22, 3.7, BED_D, M.stone, -BED_W/2, 1.85, 0, g);
  // 顶棚
  roofs.push(box(BED_W, 0.22, BED_D, M.stone, 0, 3.72, 0, g));

  // 落地窗（朝海 +Z）
  const glass = box(BED_W-0.4, 3.4, 0.08, M.glass, 0, 1.75, BED_D/2-0.05, g, false);
  glass.castShadow = false;
  // 窗框
  box(BED_W-0.4, 0.12, 0.14, M.metal, 0, 3.46, BED_D/2-0.05, g);
  box(BED_W-0.4, 0.12, 0.14, M.metal, 0, 0.08, BED_D/2-0.05, g);
  for(let k=-1;k<=1;k++) box(0.1, 3.4, 0.14, M.metal, k*(BED_W/3), 1.75, BED_D/2-0.05, g);

  // ---- 床（1.8×2.1）----
  const bedZ = -0.4;
  box(2.1, 0.36, 2.4, M.woodLt, 0, 0.18, bedZ, g);                   // 床架
  box(2.0, 0.34, 2.3, M.linen, 0, 0.5, bedZ, g);                     // 床垫
  box(2.02, 0.16, 1.35, accent, 0, 0.72, bedZ+0.44, g);              // 床尾毯
  box(2.14, 0.26, 2.05, M.linen, 0, 0.74, bedZ+0.12, g);              // 被子覆盖
  box(2.18, 0.1, 1.5, accent, 0, 0.9, bedZ+0.42, g);                // 床尾毯
  box(2.5, 1.15, 0.18, M.wood, 0, 1.0, bedZ-1.32, g);                // 床头板
  // 枕头
  [[-0.5,0],[0.5,0]].forEach(([px])=>{
    const p = box(0.95, 0.26, 0.58, M.linen, px, 0.8, bedZ-0.95, g);
    p.rotation.x = -0.12;
  });
  // 靠枕
  box(1.3, 0.34, 0.18, accent, 0, 0.86, bedZ-1.12, g);

  // ---- 床头柜 + 台灯 ----
  [-1.55, 1.55].forEach(px=>{
    box(0.6, 0.55, 0.5, M.wood, px, 0.28, bedZ-1.0, g);
    cyl(0.16,0.2,0.06, M.brass, px, 0.6, bedZ-1.0, g);
    cyl(0.05,0.05,0.22, M.brass, px, 0.71, bedZ-1.0, g);
    const shade = new T.Mesh(new T.CylinderGeometry(0.17,0.22,0.24,20,1,true),
      new T.MeshStandardMaterial({color:0xfff0d2, emissive:0xffcf8a, emissiveIntensity:1.5,
        roughness:.9, side:T.DoubleSide}));
    shade.position.set(px, 0.94, bedZ-1.0); g.add(shade);
  });

  // ---- 衣柜 ----
  box(2.6, 2.7, 0.62, M.wood, -BED_W/2+1.55, 1.35, -2.9, g);
  box(1.28, 2.56, 0.04, M.woodLt, -BED_W/2+1.55-0.66, 1.35, -2.58, g);
  box(1.28, 2.56, 0.04, M.woodLt, -BED_W/2+1.55+0.66, 1.35, -2.58, g);

  // ---- 床尾长凳 ----
  box(1.7, 0.34, 0.5, M.fabric, 0, 0.2, bedZ+1.55, g);
  [-0.72,0.72].forEach(px=> cyl(0.04,0.04,0.2,M.metal, px, 0.1, bedZ+1.55, g, 10));

  // ---- 地毯（带织纹）----
  plane(3.6, 3.2, new T.MeshStandardMaterial({map:TEX.rug, roughness:1}), 0, 0.03, bedZ+0.25, g);

  // ---- 靠窗休闲椅 + 边几 ----
  const chZ = BED_D/2 - 1.6;
  [[-3.0],[3.0]].forEach(([px])=>{
    box(0.85, 0.18, 0.85, M.fabric, px, 0.34, chZ, g);

function makeLabel(text, sub, x, y, z){

/* ---------- 相机控制（自实现轨道） ---------- */
const rig = {
  target: new T.Vector3(0, 6, 4),
  theta: 0.6, phi: 1.02, radius: 95,
  tTarget: new T.Vector3(0, 6, 4), tTheta: 0.6, tPhi: 1.02, tRadius: 95,
  drag: null, smoothing: 0.08, auto: true, fov: 46, tFov: 46
};
function applyRig(){
  const r = rig.radius, p = rig.phi, t = rig.theta;
  camera.position.set(
    rig.target.x + r*Math.sin(p)*Math.cos(t),
    rig.target.y + r*Math.cos(p),
    rig.target.z + r*Math.sin(p)*Math.sin(t)
  );
  camera.lookAt(rig.target);
}
function ease(cur, tgt, k){ return cur + (tgt-cur)*k; }

canvas.addEventListener('pointerdown', e=>{
  rig.auto = false;
  rig.drag = {x:e.clientX, y:e.clientY, btn:e.button};
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointerup', ()=>{ rig.drag = null; });
canvas.addEventListener('pointermove', e=>{
  if(!rig.drag) return;
  const dx = e.clientX - rig.drag.x, dy = e.clientY - rig.drag.y;
  rig.drag.x = e.clientX; rig.drag.y = e.clientY;
  if(rig.drag.btn === 0){
    rig.tTheta -= dx*0.005;
    rig.tPhi = Math.min(Math.max(rig.tPhi - dy*0.004, 0.12), 1.52);
  } else {
    const f = rig.radius*0.0012;
    const right = new T.Vector3().crossVectors(new T.Vector3(0,1,0),
      new T.Vector3().subVectors(camera.position, rig.target)).normalize();
    rig.tTarget.addScaledVector(right, dx*f).addScaledVector(new T.Vector3(0,1,0), -dy*f);
  }
});
canvas.addEventListener('wheel', e=>{
  e.preventDefault(); rig.auto = false;
  rig.tRadius = Math.min(Math.max(rig.tRadius * (1 + Math.sign(e.deltaY)*0.09), 4), 320);
}, {passive:false});

function goView(v, instant){
  rig.auto = false;
  roofHidden = !v.interior; applyRoofState();
  rig.tFov = v.interior ? 62 : 46;
  rig.tTarget.copy(v.look);
  const d = new T.Vector3().subVectors(v.pos, v.look);
  rig.tRadius = d.length();
  rig.tPhi = Math.acos(Math.min(Math.max(d.y/rig.tRadius, -1), 1));
  rig.tTheta = Math.atan2(d.z, d.x);
  // 最短路径旋转
  while(rig.tTheta - rig.theta > Math.PI) rig.tTheta -= Math.PI*2;
  while(rig.tTheta - rig.theta < -Math.PI) rig.tTheta += Math.PI*2;
  if(instant){ rig.target.copy(rig.tTarget); rig.radius = rig.tRadius;
    rig.phi = rig.tPhi; rig.theta = rig.tTheta; applyRig(); }
}

/* ---------- 光照方案：日 / 黄昏 / 夜 ---------- */
const MOODS = {
  day:  {sunC:0xfff1d8, sunI:3.1, hemiI:0.85, top:0x2f6fa8, mid:0x8fc4d8, bot:0xf3e7d3,
         exp:1.02, seaD:0x0d3f52, seaS:0x2b8ea0, room:2.4},
  dusk: {sunC:0xff9b5a, sunI:2.4, hemiI:0.55, top:0x22376b, mid:0xd98a5f, bot:0xf7d9b0,
         exp:1.06, seaD:0x122a42, seaS:0x3f6f86, room:3.4},
  night:{sunC:0x9fc0ff, sunI:0.55, hemiI:0.20, top:0x050a16, mid:0x0c1a2e, bot:0x16283a,
         exp:1.16, seaD:0x04121c, seaS:0x0b3a4a, room:5.2},
};
function applyMood(name){
  const m = MOODS[name] || MOODS.day;
  sun.color.setHex(m.sunC); sun.intensity = m.sunI;
  hemi.intensity = m.hemiI;
  renderer.toneMappingExposure = m.exp;
  skyMat.uniforms.top.value.setHex(m.top);
  skyMat.uniforms.mid.value.setHex(m.mid);
  skyMat.uniforms.bot.value.setHex(m.bot);
  seaUniforms.uDeep.value.setHex(m.seaD);
  seaUniforms.uShallow.value.setHex(m.seaS);
  roomLights.forEach(l=>{ l.intensity = m.room; });
  document.querySelectorAll('.mood').forEach(b=> b.classList.toggle('on', b.dataset.mood === name));
}

// 用 hash 直达视角，方便分享与截图：#bed1 #bed6 #living #pool #top #sea #master
const HASH = {
  top:'1', sea:'2', living:'3', pool:'4', master:'8', bath:'9',
  bed1:'5', bed2:'6', bed3:'7'
};
function navHash(){
  const h = (location.hash||'').replace('#','').toLowerCase();
  if(!h) return;
  if(['day','dusk','night'].includes(h)){ applyMood(h); if(typeof goView==='function') goView(VIEWS[0], true); return; }
  let v = VIEWS.find(x=>x.key === HASH[h]);
  if(h.startsWith('bed')){
    const i = parseInt(h.slice(3), 10) - 1;
    if(bedRooms[i]) v = VIEWS.find(x=>x.name === bedRooms[i].name);
  }
  if(v){
    goView(v, true);
    showInfo(v.name, v.meta, h==='living' ? 'living' : h==='pool' ? 'pool' : h==='master' ? 'master' : h==='bath' ? 'bath' : 'bed');
  }
}

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new T.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  seaUniforms.uTime.value = t;

  // 相机平滑
  rig.target.lerp(rig.tTarget, rig.smoothing);
  rig.radius = ease(rig.radius, rig.tRadius, rig.smoothing);
  rig.theta = ease(rig.theta, rig.tTheta, rig.smoothing);
  rig.phi = ease(rig.phi, rig.tPhi, rig.smoothing);
  rig.fov = ease(rig.fov, rig.tFov, rig.smoothing);
  if(Math.abs(camera.fov - rig.fov) > 0.01){ camera.fov = rig.fov; camera.updateProjectionMatrix(); }
  if(rig.auto){
    rig.tTheta += 0.00035;
  }
  applyRig();

  // 泳池水面轻微起伏
  poolWater.position.y = 0.16 + Math.sin(t*1.4)*0.012;

  renderer.render(scene, camera);
}
animate();
