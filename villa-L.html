<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>海景别墅 · L 形布局 · 3D 方案 v3</title>
<style>
  :root{--glass:rgba(12,18,22,.74);--line:rgba(255,255,255,.16);--accent:#c8a06a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1418;color:#f6f2ea;
    font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif}
  canvas{display:block;position:fixed;inset:0}
  .panel{position:fixed;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);
    border-radius:16px;z-index:10;box-shadow:0 18px 50px rgba(0,0,0,.45)}
  #left{left:18px;top:18px;width:280px;padding:16px}
  #left h1{margin:0;font-size:16px;letter-spacing:.14em}
  .sub{font-size:10px;color:#9fb1b8;letter-spacing:.2em;margin:2px 0 12px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}
  .stat{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:7px 9px}
  .stat b{display:block;font-size:15px}.stat span{font-size:10px;color:#93a6ad}
  .sechead{font-size:10px;letter-spacing:.2em;color:#8fa2a9;margin:10px 0 6px}
  .rooms{display:flex;flex-direction:column;gap:4px;max-height:250px;overflow:auto}
  .room{display:flex;justify-content:space-between;padding:7px 9px;border-radius:8px;font-size:12px;
    cursor:pointer;border:1px solid transparent;background:rgba(255,255,255,.03);color:#dbe6e9}
  .room:hover{background:rgba(200,160,106,.14);border-color:rgba(200,160,106,.35)}
  .room.on{background:rgba(200,160,106,.2);border-color:var(--accent);color:#fff}
  .room i{font-style:normal;font-size:10px;color:#8fa2a9}
  .toggles{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  button.t{flex:1;min-width:74px;background:rgba(255,255,255,.06);color:#cfe0e4;border:1px solid var(--line);
    border-radius:8px;padding:6px;font-size:11px;cursor:pointer}
  button.t.on{background:rgba(200,160,106,.22);border-color:var(--accent);color:#fff}
  #right{right:18px;top:18px;width:250px;padding:14px;display:none}
  #right.show{display:block}
  #right h2{margin:0 0 8px;font-size:14px}
  .kv{display:flex;justify-content:space-between;font-size:11.5px;padding:4px 0;border-bottom:1px dashed rgba(255,255,255,.1)}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(120% 90% at 50% 45%,transparent 42%,rgba(0,0,0,.38) 100%);}
  #tip{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);font-size:11px;color:#a9bcc2;
    background:rgba(10,16,20,.7);border:1px solid var(--line);padding:7px 14px;border-radius:99px}
  #load{position:fixed;inset:0;display:grid;place-items:center;background:#0b1418;z-index:50;
    font-size:12px;letter-spacing:.2em;color:#8fa2a9;transition:opacity .5s}
  #load.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="left" class="panel">
  <h1>海 景 别 墅 · L 形</h1>
  <div class="sub">SEASIDE VILLA · 3,012 m²</div>
  <div class="stats">
    <div class="stat"><b>3,012</b><span>建筑面积 m²</span></div>
    <div class="stat"><b>2 层</b><span>下层客厅 · 上层卧室</span></div>
    <div class="stat"><b>6</b><span>海景套房</span></div>
    <div class="stat"><b>25 m</b><span>无边际泳池</span></div>
  </div>
  <div class="sechead">视 角</div>
  <div class="rooms" id="rooms"></div>
  <div class="toggles">
    <button class="t on" id="bRoof">隐藏屋顶</button>
    <button class="t" id="bTop">俯瞰</button>
  </div>
  <div class="toggles">
    <button class="t" id="bAuto">自动旋转</button>
    <button class="t" id="bWhite">白模对照</button>
    <button class="t" id="bReset">重置</button>
  </div>
  <div class="toggles">
    <button class="t on" id="mDay">午后</button>
    <button class="t" id="mDusk">黄昏</button>
    <button class="t" id="mNight">夜景</button>
  </div>
</div>
<div id="right" class="panel"><h2>—</h2><div id="kv"></div></div>
<div id="tip">拖拽旋转 · 滚轮缩放 · 右键平移 · 数字键 1–9 切换</div>
<div id="load">构建场景…</div>
<div id="vig"></div>

<script src="three.min.js"></script>
<script>
const T = THREE;
const cvs = document.getElementById('c');
const renderer = new T.WebGLRenderer({canvas:cvs, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.outputColorSpace = T.SRGBColorSpace;
const LITE = location.search.includes('lite');
if(LITE){ renderer.setPixelRatio(1); renderer.shadowMap.enabled = false; }

const scene = new T.Scene();
scene.fog = new T.Fog(0xbfd8de, 200, 700);
const camera = new T.PerspectiveCamera(46, innerWidth/innerHeight, 0.1, 3000);

/* ---------- 天空 ---------- */
const skyMat = new T.ShaderMaterial({
  side:T.BackSide,
  uniforms:{top:{value:new T.Color(0x2f6fa8)}, mid:{value:new T.Color(0x8fc4d8)}, bot:{value:new T.Color(0xf3e7d3)}},
  vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:`varying vec3 vP;uniform vec3 top,mid,bot;
    void main(){float h=normalize(vP).y;vec3 c=mix(bot,mid,smoothstep(-.05,.28,h));
    c=mix(c,top,smoothstep(.25,.85,h));gl_FragColor=vec4(c,1.);}`
});
scene.add(new T.Mesh(new T.SphereGeometry(1500,32,20), skyMat));

/* ---------- 环境反射（程序化 PMREM，无外部 HDR） ---------- */
const envScene = new T.Scene();
const envSphere = new T.Mesh(new T.SphereGeometry(50, 24, 16), new T.ShaderMaterial({
  side: T.BackSide,
  uniforms:{ top:{value:new T.Color(0x2a6fa8)}, hor:{value:new T.Color(0xbfd8de)}, bot:{value:new T.Color(0x8a7d68)} },
  vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:`varying vec3 vP;uniform vec3 top,hor,bot;
    void main(){float h=normalize(vP).y;
      vec3 c=mix(bot,hor,smoothstep(-0.35,0.02,h));
      c=mix(c,top,smoothstep(0.0,0.7,h));
      gl_FragColor=vec4(c,1.);}`
}));
envScene.add(envSphere);
if(!LITE){
const pmrem = new T.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
const envRT = pmrem.fromScene(envScene, 0.03);
scene.environment = envRT.texture;
pmrem.dispose();
}

/* ---------- 光 ---------- */
const sunDir = new T.Vector3(-0.42,0.66,-0.62).normalize();
const sun = new T.DirectionalLight(0xfff1d8, 3.0);
sun.position.copy(sunDir).multiplyScalar(180);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{near:10,far:460,left:-130,right:130,top:130,bottom:-130});
sun.shadow.bias = -0.0006;
scene.add(sun);
const hemi = new T.HemisphereLight(0xcfe6ff, 0x6b5b46, 0.8); scene.add(hemi);

/* ---------- 海 ---------- */
const seaU = {uTime:{value:0},uSun:{value:sunDir.clone()},
  uDeep:{value:new T.Color(0x0d3f52)},uShallow:{value:new T.Color(0x2b8ea0)},uHor:{value:new T.Color(0xbfd8de)}};
const sea = new T.Mesh(new T.PlaneGeometry(2600,2600,150,150), new T.ShaderMaterial({
  uniforms: seaU,
  vertexShader:`uniform float uTime;varying vec3 vW;varying vec3 vN;varying float vH;
    float h(vec2 p){return .40*sin(p.x*.055+uTime*.9)+.26*sin(p.y*.077-uTime*1.1)
      +.15*sin((p.x+p.y)*.16+uTime*1.6);}
    void main(){vec3 p=position;float H=h(p.xy);
      vec2 d=vec2(.055*.40*cos(p.x*.055+uTime*.9),.077*.26*cos(p.y*.077-uTime*1.1));
      vN=normalize(vec3(-d.x,1.,-d.y));vH=H;p.z+=H;
      vW=(modelMatrix*vec4(p,1.)).xyz;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}`,
  fragmentShader:`uniform vec3 uSun,uDeep,uShallow,uHor;varying vec3 vW;varying vec3 vN;varying float vH;
    void main(){vec3 V=normalize(cameraPosition-vW);vec3 N=normalize(vN);
      float fres=pow(1.-max(dot(N,V),0.),3.);
      vec3 col=mix(uDeep,uShallow,smoothstep(-.5,.6,vH));
      vec3 R=reflect(-uSun,N);
      col+=uHor*fres*.55+vec3(1.,.93,.78)*pow(max(dot(R,V),0.),120.)*3.;
      col=mix(col,uHor,smoothstep(340.,950.,length(cameraPosition.xz-vW.xz)));
      gl_FragColor=vec4(col,1.);}`
}));
sea.rotation.x = -Math.PI/2; scene.add(sea);

/* ---------- 贴图 ---------- */
function tex(w,h,draw,rx,ry){
  const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rx||1,ry||1);
  t.colorSpace=T.SRGBColorSpace;t.anisotropy=8;return t;
}
const TEX = {
  wood: tex(512,512,(g,w,h)=>{
    g.fillStyle='#a97a4b';g.fillRect(0,0,w,h);
    for(let i=0;i<150;i++){const y=Math.random()*h;
      g.strokeStyle=`rgba(60,34,16,${.03+Math.random()*.07})`;g.lineWidth=.6+Math.random()*1.5;
      g.beginPath();g.moveTo(0,y);for(let x=0;x<=w;x+=32)g.lineTo(x,y+Math.sin(x*.02+i)*3);g.stroke();}
    g.strokeStyle='rgba(40,24,12,.5)';g.lineWidth=2.5;
    for(let i=1;i<4;i++){g.beginPath();g.moveTo(0,i*h/4);g.lineTo(w,i*h/4);g.stroke();}
  },2,2),
  marble: tex(512,512,(g,w,h)=>{
    g.fillStyle='#f2ede4';g.fillRect(0,0,w,h);
    for(let i=0;i<24;i++){g.strokeStyle=`rgba(150,140,125,${.05+Math.random()*.12})`;
      g.lineWidth=.6+Math.random()*2;g.beginPath();let x=Math.random()*w,y=0;g.moveTo(x,y);
      while(y<h){x+=(Math.random()-.5)*40;y+=20+Math.random()*26;g.lineTo(x,y);}g.stroke();}
  },3,3)
};

/* ---------- 材质 ---------- */
const M = {
  stone: new T.MeshStandardMaterial({color:0xd6c8b2, roughness:.82}),
  stoneDk: new T.MeshStandardMaterial({color:0xa89a86, roughness:.9}),
  rock: new T.MeshStandardMaterial({color:0x6e6558, roughness:1}),
  grass: new T.MeshStandardMaterial({color:0x4a6b3c, roughness:.95}),
  wood: new T.MeshStandardMaterial({color:0x8a5a33, roughness:.55}),
  woodLt: new T.MeshStandardMaterial({color:0xc9a06d, roughness:.6}),
  floor: new T.MeshStandardMaterial({map:TEX.wood, roughness:.55}),
  marble: new T.MeshStandardMaterial({map:TEX.marble, roughness:.26}),
  fabric: new T.MeshStandardMaterial({color:0xece5da, roughness:.95}),
  linen: new T.MeshStandardMaterial({color:0xfaf7f1, roughness:.92}),
  dark: new T.MeshStandardMaterial({color:0x24201c, roughness:.7}),
  metal: new T.MeshStandardMaterial({color:0x3d4147, roughness:.35, metalness:.85}),
  brass: new T.MeshStandardMaterial({color:0xc8a06a, roughness:.3, metalness:.9}),
  glass: new T.MeshPhysicalMaterial({color:0xdff1f6, roughness:.06, transparent:true, opacity:.15,
    side:T.DoubleSide, depthWrite:false}),
  water: new T.MeshPhysicalMaterial({color:0x2fa3b8, roughness:.08, transparent:true, opacity:.82})
};

const ACC = [0x2f7f8a,0xb5895f,0xa8564b,0x33475f,0x6f7d54,0x8a5f76];
const FL = 3.6;                      // 首层地坪
const UY = FL + 7.0;                 // 二层楼面
const roofs = [], roomLights = [];

/* ---------- 接触阴影（程序化径向渐变） ---------- */
const blobTex = (function(){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const g=c.getContext('2d');
  const grd=g.createRadialGradient(64,64,4,64,64,62);
  grd.addColorStop(0,'rgba(0,0,0,.42)'); grd.addColorStop(.55,'rgba(0,0,0,.18)');
  grd.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=grd; g.fillRect(0,0,128,128);
  const t=new T.CanvasTexture(c); t.colorSpace=T.SRGBColorSpace; return t;
})();
const blobMat = new T.MeshBasicMaterial({map:blobTex, transparent:true, depthWrite:false, opacity:.9});
function blob(w,d,x,y,z,parent){
  const m=new T.Mesh(new T.PlaneGeometry(w,d), blobMat);
  m.rotation.x=-Math.PI/2; m.position.set(x,y,z); (parent||scene).add(m); return m;
}

/* ---------- 基础几何 ---------- */
function box(w,h,d,mat,x,y,z,parent,cast=true){
  const m=new T.Mesh(new T.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=true;(parent||scene).add(m);return m;
}
function cyl(rt,rb,h,mat,x,y,z,parent,seg=20){
  const m=new T.Mesh(new T.CylinderGeometry(rt,rb,h,seg),mat);
  m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;(parent||scene).add(m);return m;
}
function plane(w,d,mat,x,y,z,parent){
  const m=new T.Mesh(new T.PlaneGeometry(w,d),mat);
  m.rotation.x=-Math.PI/2;m.position.set(x,y,z);m.receiveShadow=true;(parent||scene).add(m);return m;
}

/* ---------- 场地 ---------- */
const island = new T.Group(); scene.add(island);
box(150, 12, 96, M.rock, 0, FL-6.2, 10, island);
box(146, 0.5, 92, M.grass, 0, FL-0.30, 10, island);
for(let i=0;i<28;i++){
  const a=(i/28)*Math.PI*2, r=76+Math.random()*18, s=2+Math.random()*5;
  const rk=new T.Mesh(new T.DodecahedronGeometry(s,0),M.rock);
  rk.position.set(Math.cos(a)*r, FL-4.4+Math.random()*2.2, Math.sin(a)*r*0.62+10);
  rk.rotation.set(Math.random(),Math.random(),Math.random());
  rk.castShadow=rk.receiveShadow=true; island.add(rk);
}

/* ---------- 别墅（L 形） ---------- */
const villa = new T.Group(); scene.add(villa);

/* 底层：客厅 + 餐厅 + 卫浴，整面朝海（+Z） */
const GX = 58, GZ = 18, GZ0 = 2;        // 底层体量 58×18，中心 z=2
box(GX+4, 0.7, GZ+4, M.stone, 0, FL-0.35, GZ0, villa);
plane(GX, GZ, M.marble, 0, FL+0.02, GZ0, villa);
// 后墙 / 两侧
box(GX, 6.6, 0.3, M.stone, 0, FL+3.3, GZ0-GZ/2, villa);
box(0.3, 6.6, GZ, M.stone, -GX/2, FL+3.3, GZ0, villa);
box(0.3, 6.6, GZ, M.stone,  GX/2, FL+3.3, GZ0, villa);
// 朝海玻璃
box(GX-0.6, 6.3, 0.1, M.glass, 0, FL+3.15, GZ0+GZ/2-0.06, villa, false);
for(let k=-4;k<=4;k++) box(0.12, 6.3, 0.16, M.metal, k*6.4, FL+3.15, GZ0+GZ/2-0.06, villa);
roofs.push(box(GX+1.6, 0.32, GZ+1.6, M.stone, 0, FL+6.7, GZ0, villa));

/* 客厅（西侧） */
const liv = new T.Group(); liv.position.set(-8, FL, GZ0); villa.add(liv);
plane(30, 16, new T.MeshStandardMaterial({color:0xe9e0cf, roughness:1}), 0, 0.03, 0.6, liv);
// 沙发组
blob(8.0, 4.2, -3, 0.015, 1.5, liv);
box(8.4, 0.45, 2.8, M.fabric, -3, 0.28, 1.5, liv);
box(8.4, 1.05, 0.35, M.fabric, -3, 0.7, 0.1, liv);
box(0.5, 0.72, 2.6, M.fabric, -7.1, 0.52, 1.5, liv);
box(0.5, 0.72, 2.6, M.fabric, 1.1, 0.52, 1.5, liv);
[[-5.6],[-3],[-0.4]].forEach(([x])=> box(2.1,0.22,2.2, M.linen, x, 0.56, 1.6, liv));
// 茶几
blob(4.2, 2.2, -3, 0.014, 4.4, liv);
box(3.8, 0.14, 1.9, M.marble, -3, 0.42, 4.4, liv);
[-1.6,1.6].forEach(x=>[-0.7,0.7].forEach(z=> cyl(0.05,0.05,0.4,M.metal, -3+x,0.21,4.4+z,liv,8)));
// 单椅
[[-9.2,3.6,0.9],[-9.2,-1.2,-0.9]].forEach(([x,z,ry])=>{
  const g=new T.Group(); g.position.set(x,0,z); g.rotation.y=ry; liv.add(g);
  box(1.6,0.42,1.5, M.fabric, 0,0.26,0, g); box(1.6,1.0,0.2, M.fabric, 0,0.65,-0.65, g);
});
// 落地灯 + 绿植
cyl(0.18,0.18,0.05,M.metal,-9.6,0.03,6.4,liv,16);
cyl(0.03,0.03,1.9,M.metal,-9.6,1.0,6.4,liv,8);
const sh=new T.Mesh(new T.CylinderGeometry(0.32,0.26,0.36,18,1,true),
  new T.MeshStandardMaterial({color:0xfff3da,emissive:0xffd9a0,emissiveIntensity:1.7,side:T.DoubleSide}));
sh.position.set(-9.6,1.98,6.4); liv.add(sh);
[[2.2,6.6],[2.2,-2.4]].forEach(([x,z])=>{
  cyl(0.34,0.28,0.5,new T.MeshStandardMaterial({color:0x8c8377,roughness:.95}),x,0.25,z,liv,16);
  [[0,0.85,0,0.52],[0.26,1.05,0.1,0.34],[-0.2,1.0,-0.12,0.28]].forEach(([dx,dy,dz,r])=>{
    const s=new T.Mesh(new T.SphereGeometry(r,10,8),new T.MeshStandardMaterial({color:0x2f6b3a,roughness:.9}));
    s.position.set(x+dx,dy,z+dz); s.scale.y=0.78; s.castShadow=true; liv.add(s);
  });
});

/* 餐厅 + 开放厨房（东侧） */
const din = new T.Group(); din.position.set(14, FL, GZ0); villa.add(din);
box(6.4, 0.16, 2.2, M.woodLt, 0, 0.76, 0, din);
[-2.8,-0.9,0.9,2.8].forEach(x=>[-0.9,0.9].forEach(z=>{
  box(0.9,0.74,0.9, M.wood, x, 0.37, z*1.7, din);
  box(0.9,0.9,0.12, M.wood, x, 0.9, z*1.7+ (z>0?0.5:-0.5), din);
}));
for(let k=-1;k<=1;k++){
  cyl(0.02,0.02,2.4,M.metal, k*2.2, FL+5.2-GZ0, 0, din, 6);
  const shade=new T.Mesh(new T.ConeGeometry(0.46,0.5,20,1,true),
    new T.MeshStandardMaterial({color:0x2b2b2b,roughness:.6,side:T.DoubleSide}));
  shade.position.set(k*2.2, FL+4.0-GZ0, 0); din.add(shade);
}
// 厨房岛台
box(7.0, 0.95, 1.8, M.stoneDk, -6.5, 0.48, -6.2, din);
box(7.2, 0.08, 2.0, M.marble, -6.5, 0.99, -6.2, din);
[-8.5,-6.5,-4.5].forEach(x=> cyl(0.02,0.02,0.85,M.metal, x, 0.42, -4.9, din, 8));

/* 卫浴（底层西端，整面朝海） */
const bath = new T.Group(); bath.position.set(-22, FL, GZ0+2); villa.add(bath);
plane(9, 8, M.marble, 0, 0.03, 0, bath);
box(9, 3.2, 0.2, M.stone, 0, 1.6, -4, bath);
box(0.2, 3.2, 8, M.stone, -4.5, 1.6, 0, bath);
box(8.8, 2.9, 0.08, M.glass, 0, 1.45, 3.95, bath, false);
roofs.push(box(9.4, 0.26, 8.4, M.stone, 0, 3.28, 0, bath));
// 独立浴缸
const tubY=0.3;
const tub=new T.Mesh(new T.CylinderGeometry(0.62,0.56,0.6,36),M.marble);
tub.scale.set(1.6,1,0.9); tub.position.set(-1.6,tubY,2.0); tub.castShadow=true; bath.add(tub);
blob(2.6,1.8,-1.6,0.014,2.0,bath);
const ti=new T.Mesh(new T.CylinderGeometry(0.5,0.46,0.5,36),
  new T.MeshStandardMaterial({color:0xfbfaf6,roughness:.18}));
ti.scale.set(1.5,1,0.86); ti.position.set(-1.6,tubY+0.04,2.0); bath.add(ti);
const tw=new T.Mesh(new T.CircleGeometry(0.46,36),M.water);
tw.rotation.x=-Math.PI/2; tw.scale.set(1.48,0.84,1); tw.position.set(-1.6,tubY+0.22,2.0); bath.add(tw);
cyl(0.05,0.05,1.1,M.brass,-3.1,0.56,2.3,bath,10);

                      rig.target.y+r*Math.cos(p),

function goView(v,instant){
  rig.auto=false; setRoofs(!v.interior); rig.tFov=v.interior?62:46;
  rig.tTarget.copy(v.look);
  const d=new T.Vector3().subVectors(v.pos,v.look);
  rig.tRadius=d.length();
  rig.tPhi=Math.acos(Math.min(Math.max(d.y/rig.tRadius,-1),1));
  rig.tTheta=Math.atan2(d.z,d.x);
  while(rig.tTheta-rig.theta>Math.PI) rig.tTheta-=Math.PI*2;
  while(rig.tTheta-rig.theta<-Math.PI) rig.tTheta+=Math.PI*2;
  if(instant){ rig.target.copy(rig.tTarget); rig.radius=rig.tRadius; rig.phi=rig.tPhi;
    rig.theta=rig.tTheta; camera.fov=rig.tFov; camera.updateProjectionMatrix(); applyRig(); }
  document.querySelectorAll('.room').forEach(n=>n.classList.toggle('on', n.dataset.key===v.key));
  showInfo(v);
}

let whiteMode=false;
const whiteMat=new T.MeshStandardMaterial({color:0xf1efea, roughness:.92});
const matBackup=new Map();
function toggleWhite(force){
  whiteMode = (force===undefined) ? !whiteMode : force;
  scene.traverse(o=>{
    if(!o.isMesh || !o.material) return;
    if(whiteMode){
      if(o.material.isShaderMaterial || o.material.transparent) return;
      matBackup.set(o, o.material); o.material = whiteMat;
    } else if(matBackup.has(o)){
      o.material = matBackup.get(o);
    }
  });
  if(!whiteMode) matBackup.clear();
  const b=document.getElementById('bWhite');
  if(b) b.classList.toggle('on', whiteMode);
}
document.getElementById('bWhite').onclick=()=>toggleWhite();

setRoofs(true);
goView(VIEWS[0],true);
if(location.search.includes('white')) toggleWhite(true);
mood('day');
navHash();
document.getElementById('load').classList.add('hide');

const clock=new T.Clock();
(function loop(){
  requestAnimationFrame(loop);
  const t=clock.getElapsedTime();
  seaU.uTime.value=t;
  rig.target.lerp(rig.tTarget,rig.smoothing);
  rig.radius=ease(rig.radius,rig.tRadius,rig.smoothing);
  rig.theta=ease(rig.theta,rig.tTheta,rig.smoothing);
  rig.phi=ease(rig.phi,rig.tPhi,rig.smoothing);
  rig.fov=ease(rig.fov,rig.tFov,rig.smoothing);
  if(Math.abs(camera.fov-rig.fov)>0.01){camera.fov=rig.fov;camera.updateProjectionMatrix();}
  if(rig.auto) rig.tTheta+=0.0003;
  applyRig();
  pw.position.y=0.02+Math.sin(t*1.3)*0.012;
  renderer.render(scene,camera);
})();
</script>
</body>
