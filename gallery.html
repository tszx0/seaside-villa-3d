<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>海景别墅 · 装修方案画廊</title>
<style>
  :root{--bg:#0b1114;--ink:#f4f0e8;--dim:#94a5ab;--accent:#c8a06a;--line:rgba(255,255,255,.12)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0}
  .slide{position:absolute;inset:0;opacity:0;transition:opacity .7s ease;pointer-events:none}
  .slide.on{opacity:1}
  .slide img{width:100%;height:100%;object-fit:cover;display:block}
  .ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:40px}
  .ph .t{font-size:26px;letter-spacing:.24em;margin-bottom:14px}
  .ph .s{font-size:12px;color:var(--dim);letter-spacing:.14em;line-height:2}
  .ph code{background:rgba(255,255,255,.08);padding:2px 8px;border-radius:5px;color:var(--accent)}
  #veil{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(8,12,14,.55) 0%,transparent 26%,transparent 62%,rgba(8,12,14,.82) 100%)}
  /* 左侧导航 */
  #nav{position:fixed;left:26px;top:26px;bottom:26px;width:250px;z-index:5;
    display:flex;flex-direction:column;justify-content:center;gap:6px}
  #brand{margin-bottom:26px}
  #brand h1{margin:0;font-size:15px;letter-spacing:.22em;font-weight:600}
  #brand p{margin:6px 0 0;font-size:10px;color:var(--dim);letter-spacing:.22em}
  .item{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:9px;cursor:pointer;
    color:#c8d5d9;font-size:13px;border:1px solid transparent;transition:.18s}
  .item:hover{background:rgba(255,255,255,.05)}
  .item.on{background:rgba(200,160,106,.16);border-color:rgba(200,160,106,.5);color:#fff}
  .item b{font-size:10px;color:var(--dim);font-weight:400;font-variant-numeric:tabular-nums}
  .item.on b{color:var(--accent)}
  /* 说明 */
  #cap{position:fixed;left:300px;right:40px;bottom:40px;z-index:5}
  #cap h2{margin:0 0 8px;font-size:22px;letter-spacing:.1em;font-weight:500}
  #cap p{margin:0;font-size:12.5px;color:#b9c8cd;letter-spacing:.06em;line-height:1.9;max-width:720px}
  #idx{position:fixed;right:34px;top:32px;z-index:5;font-size:11px;color:var(--dim);
    letter-spacing:.2em;font-variant-numeric:tabular-nums}
  #hint{position:fixed;right:34px;bottom:34px;z-index:5;font-size:11px;color:#7f939a;letter-spacing:.08em}
  kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;font-size:10px}
  @media (max-width:820px){
    #nav{width:auto;left:16px;right:16px;top:auto;bottom:96px;flex-direction:row;overflow-x:auto}
    #brand{display:none}
    #cap{left:16px;right:16px;bottom:26px}
    #cap h2{font-size:17px}
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="veil"></div>

<nav id="nav">
  <div id="brand">
    <h1>海 景 别 墅</h1>
    <p>SEASIDE VILLA · 3,012 m²</p>
  </div>
  <div id="items"></div>
</nav>

<div id="idx">01 / 06</div>
<div id="cap"><h2>—</h2><p>—</p></div>
<div id="hint"><kbd>←</kbd> <kbd>→</kbd> 切换 · <kbd>1</kbd>–<kbd>6</kbd> 直达 · <kbd>F</kbd> 全屏</div>

<script>
/* =========================================================
   把 6 张效果图放进同目录的 images/ 文件夹即可自动生效：
     images/01-aerial.jpg    鸟瞰
     images/02-living.jpg    客厅
     images/03-master.jpg    主卧
     images/04-bath.jpg      卫浴
     images/05-bedroom.jpg   次卧
     images/06-pool.jpg      泳池露台
   （jpg/png/webp 均可，改下面的 src 即可；缺图时显示占位渐变）
   ========================================================= */
const ROOMS = [
  { n:'鸟瞰全景',  t:'鸟瞰全景', s:'建筑体量 · 无边际泳池 · 海平线',
    d:'L 形布局：底层为客厅与卫浴，整面玻璃正对海面；六间套房悬挑于二层，视野无遮挡。',
    src:'images/01-aerial.jpg', g:'linear-gradient(135deg,#12303c,#2b6f7d 55%,#c9a06a)' },
  { n:'客厅',      t:'底层客厅', s:'挑空 6.6 m · 整面朝海',
    d:'沙发组面向海面布置，地面为米白大理石通铺；深色木质茶几与黄铜落地灯构成视觉重心。',
    src:'images/02-living.jpg', g:'linear-gradient(135deg,#1d2a2e,#4a5f66 55%,#d8cbb6)' },
  { n:'主卧',      t:'二层主卧套间', s:'KING 床 · 独立露台',
    d:'床头背景为胡桃木饰面，两侧黄铜壁灯；床尾直面落地窗，晨起即可看海。',
    src:'images/03-master.jpg', g:'linear-gradient(135deg,#2a1f1a,#7a5a3f 55%,#e8d3b4)' },
  { n:'卫浴',      t:'海景卫浴', s:'独立浴缸 · 玻璃隔断',
    d:'独立石质浴缸置于落地窗前，泡澡时正面朝海；淋浴区以整片玻璃分隔，干湿分离。',
    src:'images/04-bath.jpg', g:'linear-gradient(135deg,#1c2b33,#5f8189 55%,#e6eef0)' },
  { n:'次卧',      t:'海景套房', s:'90 m² · 8 m 落地窗',
    d:'六间套房同规格，木地板、衣柜、书桌与休憩榻一体；每间配置独立卫浴。',
    src:'images/05-bedroom.jpg', g:'linear-gradient(135deg,#20302a,#4f6f57 55%,#dcd6c4)' },
  { n:'泳池',      t:'无边际泳池露台', s:'25 × 7 m',
    d:'泳池沿建筑长边展开，水面与海平线在视觉上相接；池边设四张躺椅与遮阳木平台。',
    src:'images/06-pool.jpg', g:'linear-gradient(135deg,#0d3b47,#2f95a8 55%,#d9e9ec)' },
];

const stage = document.getElementById('stage');
const items = document.getElementById('items');
const capH = document.querySelector('#cap h2');
const capP = document.querySelector('#cap p');
const idxEl = document.getElementById('idx');
let cur = 0, slides = [];

ROOMS.forEach((r, i) => {
  // 幻灯片
  const s = document.createElement('div');
  s.className = 'slide';
  const img = document.createElement('img');
  img.src = r.src; img.alt = r.t; img.loading = 'lazy';
  const ph = document.createElement('div');
  ph.className = 'ph';
  ph.innerHTML = `<div><div class="t">${r.t}</div>
    <div class="s">${r.s}<br/><br/>把效果图放到 <code>${r.src}</code><br/>刷新页面即可替换此占位图</div></div>`;
  s.appendChild(ph);
  s.appendChild(img);
  img.addEventListener('load', () => { ph.style.display = 'none'; });
  img.addEventListener('error', () => {
    img.style.display = 'none';
    s.style.background = r.g;
  });
  stage.appendChild(s);
  slides.push(s);

  // 导航项
  const it = document.createElement('div');
  it.className = 'item';
  it.innerHTML = `<b>0${i + 1}</b><span>${r.n}</span>`;
  it.onclick = () => show(i);
  items.appendChild(it);
});

function show(i){
  cur = (i + ROOMS.length) % ROOMS.length;
  slides.forEach((s, k) => s.classList.toggle('on', k === cur));
  [...items.children].forEach((n, k) => n.classList.toggle('on', k === cur));
  capH.textContent = ROOMS[cur].t;
  capP.textContent = ROOMS[cur].d;
  idxEl.textContent = `0${cur + 1} / 0${ROOMS.length}`;
  if (history.replaceState) history.replaceState(null, '', '#' + (cur + 1));
}

addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') show(cur + 1);
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') show(cur - 1);
  else if (e.key >= '1' && e.key <= '6') show(+e.key - 1);
  else if (e.key === 'f' || e.key === 'F') {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }
});

// 点击画面右/左半边也可翻页
document.getElementById('stage').addEventListener('click', e => {
  show(cur + (e.clientX > innerWidth / 2 ? 1 : -1));
});

const fromHash = parseInt((location.hash || '').replace('#', ''), 10);
show(isNaN(fromHash) ? 0 : fromHash - 1);
</script>
</body>
</html>
